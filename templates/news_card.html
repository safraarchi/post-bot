<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Card Template - Solusi Sawit Nusantara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      position: relative;
      background-color: #0b0f19;
    }
    .background-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Gradient overlay: smooth dark vignette at bottom for crisp text readability */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.25) 0%,
        rgba(0, 0, 0, 0.05) 40%,
        rgba(0, 0, 0, 0.75) 70%,
        rgba(0, 0, 0, 0.95) 100%
      );
    }
    
    /* Top Header Bar */
    .top-bar {
      position: absolute;
      top: 48px;
      left: 56px;
      right: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .badge-category {
      background: #dc2626; /* Breaking News Red */
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
    }
    .source-tag {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .source-dot {
      width: 12px;
      height: 12px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
    }

    /* Bottom Headline Content */
    .content-box {
      position: absolute;
      bottom: 60px;
      left: 56px;
      right: 56px;
      z-index: 10;
    }
    .headline-hook {
      color: #ffffff;
      font-size: 46px;
      line-height: 1.25;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 20px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.8);
    }
    .headline-highlight {
      color: #facc15; /* Yellow Accent for Eyes */
    }
    .summary-text {
      color: #e2e8f0;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.4;
      border-left: 5px solid #22c55e;
      padding-left: 18px;
      background: rgba(0, 0, 0, 0.4);
      padding-top: 8px;
      padding-bottom: 8px;
      border-radius: 0 8px 8px 0;
    }
  </style>
</head>
<body>
  <!-- Photo Background: Authentic & Realistic -->
  <img id="bgImage" class="background-img" src="../public/images/buah_sawit_jumbo.jpg" alt="Sawit">
  <div class="overlay"></div>

  <!-- Top Info -->
  <div class="top-bar">
    <div id="categoryBadge" class="badge-category">WASPADA AGRONOMI</div>
    <div class="source-tag">
      <div class="source-dot"></div>
      <span>Solusi Sawit Nusantara</span>
    </div>
  </div>

  <!-- Bottom Headline Hook -->
  <div class="content-box">
    <h1 id="headlineText" class="headline-hook">
      Daun Sawit Menguning? <span class="headline-highlight">Jangan Asal Tebak Jamur, Cek 2 Hara Ini!</span>
    </h1>
    <div id="summaryText" class="summary-text">
      Beda gejala kekurangan Magnesium (pelepah tua) vs Boron (ujung daun).
    </div>
  </div>
</body>
</html>
